# ── 🔴 النطاقُ خاصيّةٌ لا ثابتٌ مبرمَج ───────────────────────────────
#
# التطبيقُ نافذةٌ على `zadim.host`. ونطاقُ اليوم (`zadim-gk29.vercel.app`)
# نطاقُ معاينةٍ من Vercel، والنطاقُ النهائيُّ لم يُشترَ بعد. فلو كُتب في
# الكودِ لاحتاج تغييرُه تعديلَ مصدرٍ ومراجعةً ودمجاً — لأجل **سلسلةِ
# محارف**.
#
# ويُتجاوز من سطر الأمر بلا لمسِ ملفّ:
#   ./gradlew assembleRelease -Pzadim.host=zadim.sa
#
# ⚠️ وتغييرُ النطاق يُلزم أمرين معاً: هذه الخاصيّة، **و**ملفَّ روابطِ
# الأصول على النطاق الجديد. وواحدٌ بلا الآخر يُنتج تطبيقاً يعمل بشريطِ
# عنوانٍ فوقه — وهو أسوأُ من تطبيقٍ لا يفتح، لأنه يبدو ناجحاً.
zadim.host=zadim-gk29.vercel.app

# اسمُ الحزمة — **هويّةُ التطبيق التي لا تتغيّر بعد أوّل رفعٍ إلى Play**.
# لا في تحديث، ولا بتغيير النطاق، ولا بإعادة تسمية. وتغييرُه يعني
# تطبيقاً آخرَ يفقد كلَّ مثبِّتيه وتقييماتِه.
zadim.applicationId=co.zadim.store

android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m
