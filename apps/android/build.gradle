// جذرُ المشروع: لا شيءَ فيه سوى إعلانِ الملحق ونسختِه — والبناءُ كلُّه
// في `app/build.gradle`، فالوحدةُ واحدة.
//
// ⚠️ **النسخةُ مثبَّتةٌ لا `+`.** ملحقُ أندرويد يغيّر سلوكَ البناء بين
// نسخةٍ وأخرى (حدودُ R8، وافتراضاتُ `namespace`، وما يقبله `compileSdk`).
// ونسخةٌ عائمةٌ تعني بناءً ينجح اليومَ ويسقط غداً بلا التزامٍ واحدٍ بيننا.
plugins {
  id "com.android.application" version "8.9.1" apply false
}
