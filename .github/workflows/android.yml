# تطبيقُ أندرويد — البناءُ الوحيدُ الذي يُخرج ملفّاً يُثبَّت على جهاز.
#
# ── لماذا في CI ولا خيارَ غيرُه ───────────────────────────────────
#
# بناءُ أندرويد يحتاج Android SDK: ~٧٠٠ ميغابايت تُنزَّل من
# `dl.google.com`. وورشةُ التطوير التي كُتب فيها هذا الملفُّ **محجوبةٌ عن
# ذلك النطاق** (٤٠٣ من بوّابة الخروج)، فلا يُبنى فيها ولا يُختبر.
# ومُشغِّلُ `ubuntu-latest` يأتي بالـSDK مثبَّتاً ومرخَّصاً.
#
# فهذا الملفُّ ليس تسهيلاً: **هو المكانُ الذي يُعرف فيه أن المشروع يُبنى
# أصلاً**. وكلُّ ما قبله كودٌ مكتوبٌ لم يُترجم.
#
# ── ولماذا مُطلِقان لا واحد ───────────────────────────────────────
#
# `workflow_dispatch` هو المقصود: التطبيقُ لا يتغيّر مع الكود — هو نافذةٌ
# على النطاق، وتغيُّرُ المتجر لا يغيّره. فبناؤه في كلّ دفعةٍ دقائقُ تُحرق
# على ملفٍّ لم يُمسّ. ويُبنى حين يُطلب: قبل رفعٍ إلى Play، أو بعد تغيير
# النطاق أو الأيقونة.
#
# ⚠️ **لكنّ `workflow_dispatch` وحدَه لا يُشغَّل إلا بعد أن يصل الفرعَ
# الافتراضيّ** — جيت هوب يردّ ٤٠٤ على استدعائه من فرعِ عمل. أي أن مشروعَ
# أندرويد كان سيُدمج **وهو لم يُترجَم قطّ**، وهو بعينه ما تمنعه القاعدةُ
# الحاكمة في `CLAUDE.md`: «لا يُعدّ بندٌ منفَّذاً لأن الكودَ مكتوب».
#
# فأُضيف `pull_request` **بمرشّحِ مسارات**: لا يعمل إلا حين تُمسّ ملفّاتُ
# أندرويد أو هذا الملفُّ نفسُه — أي في الدفعة التي تحتاج البرهانَ وحدَها.
name: تطبيق أندرويد (APK/AAB)

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      host:
        description: "نطاقُ المتجر (بلا https://)"
        required: false
        default: ""
      versionName:
        description: "اسمُ الإصدار الظاهر — مثل 1.0.0"
        required: false
        default: "1.0.0"
      versionCode:
        description: "رقمُ الإصدار — عددٌ صحيحٌ يزيد مع كل رفع إلى Play"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v4

      - name: تهيئة JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # النطاقُ من مدخل التشغيلة إن أُعطي، وإلا فالمكتوبُ في
      # `gradle.properties`. فتشغيلةُ تجريبٍ على نطاقٍ آخر لا تحتاج التزاماً.
      - name: تحديد النطاق
        env:
          INPUT_HOST: ${{ inputs.host }}
        run: |
          HOST="$INPUT_HOST"
          if [ -z "$HOST" ]; then
            HOST=$(sed -n 's/^zadim\.host=//p' gradle.properties)
            echo "ZADIM_HOST_ARG=" >> "$GITHUB_ENV"
          else
            echo "ZADIM_HOST_ARG=-Pzadim.host=$HOST" >> "$GITHUB_ENV"
          fi
          echo "ZADIM_HOST=$HOST" >> "$GITHUB_ENV"
          echo "النطاق: $HOST"

      # ⚠️ **المفتاحُ لا يُكتب في المستودع ولا يُطبع في سجلّ.** يصل
      # مُرمَّزاً بـbase64 في سرٍّ، ويُفكّ إلى ملفٍّ في مساحةِ التشغيلة
      # التي تُمحى بانتهائها.
      #
      # 🔴 **وغيابُ السرِّ لا يُخرج شيئاً يُثبَّت.** كان مكتوباً هنا أن
      # النسخةَ غيرَ الموقَّعة «تصلح للتجريب» — **وهذا خطأ**: أندرويد
      # يرفض أيَّ حزمةٍ بلا توقيع، بالنقر وبـ`adb install` سواءً، برسالة
      # «الحزمة تبدو غير صالحة». وقد قيس على جهازٍ حقيقيّ.
      #
      # فتُبنى **نسخةُ تشخيصٍ دائماً** (`assembleDebug`) — يوقّعها Gradle
      # بمفتاحِ تشخيصٍ يولّده بنفسه، **وهي وحدَها ما يُثبَّت** قبل أن
      # يملك المالكُ مفتاحَه.
      - name: فكُّ مفتاح التوقيع
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zadim.keystore"
            echo "ZADIM_KEYSTORE_FILE=$RUNNER_TEMP/zadim.keystore" >> "$GITHUB_ENV"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::لا سرَّ ANDROID_KEYSTORE_BASE64 — سيخرج بناءٌ غيرُ موقَّع لا يُقبل في Play."
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: البناء
        env:
          ZADIM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZADIM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZADIM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon $ZADIM_HOST_ARG \
            -Pzadim.versionName="${{ inputs.versionName || '1.0.0' }}" \
            -Pzadim.versionCode="${{ inputs.versionCode || '1' }}" \
            assembleDebug assembleRelease bundleRelease

      # فحصٌ بعد البناء: النطاقُ الذي دخل الحزمةَ فعلاً — لا الذي ظنناه.
      # وقد كلّف هذا الفرقُ في هذا المستودع قبلاً: بناءٌ أخضرُ على قيمةٍ
      # غيرِ التي في الرأس.
      - name: التحقّق من النطاق داخل الحزمة
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "الحزمة: $APK"
          "$AAPT" dump resources "$APK" > "$RUNNER_TEMP/res.txt"

          # ثلاثةُ ثوابتَ لا يُقبل بناءٌ بلا واحدٍ منها — وكلُّها تخرج
          # من `zadim.host` نفسِه، فاختلافُ اثنين يعني بناءً على قيمتين.
          fail=0
          grep -q "https://$ZADIM_HOST/ar" "$RUNNER_TEMP/res.txt" || { echo "⛔ launch_url ليس على النطاق"; fail=1; }
          grep -q "\"site\": \"https://$ZADIM_HOST\"" "$RUNNER_TEMP/res.txt" || { echo "⛔ asset_statements ليس على النطاق"; fail=1; }
          grep -q "^ *(string8) *\"$ZADIM_HOST\"" "$RUNNER_TEMP/res.txt" \
            || grep -q "\"$ZADIM_HOST\"" "$RUNNER_TEMP/res.txt" \
            || { echo "⛔ host غيرُ موجودٍ في الموارد"; fail=1; }

          [ "$fail" -eq 0 ] && echo "✅ الحزمةُ مبنيّةٌ على $ZADIM_HOST في المواضع الثلاثة."
          exit "$fail"

      # 🔴 **الحارسُ الذي لم يكن موجوداً.**
      #
      # سقطت البوّابةُ خضراءَ وأخرجت حزمةً **لا تُثبَّت**، لأن لا شيءَ
      # كان يسأل «أهي موقَّعة؟». والفحصُ السابقُ سأل عن النطاق وحدَه.
      #
      # فيُسأل الآن `apksigner` نفسُه — وهو الذي يسأله أندرويد — وتُطبع
      # بصمةُ من وقّع. **ويسقط البناءُ إن لم تكن نسخةُ التشخيص موقَّعة**،
      # لأنها الوحيدةُ الموعودةُ بالتثبيت.
      - name: التحقّق من التوقيع
        run: |
          set -uo pipefail
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          fail=0
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            echo "── $(basename "$apk")"
            if "$SIGNER" verify --print-certs "$apk" > "$RUNNER_TEMP/sig.txt" 2>&1; then
              echo "   ✅ موقَّعة — تُثبَّت"
              grep -i "SHA-256 digest" "$RUNNER_TEMP/sig.txt" | head -1 | sed 's/^/   /'
            else
              echo "   ⛔ غيرُ موقَّعة — أندرويد يرفضها بـ«الحزمة تبدو غير صالحة»"
              case "$apk" in
                *debug*) fail=1 ;;
                *) echo "   (نسخةُ الإصدار: متوقَّعٌ بلا سرِّ مفتاح — ترفع إلى Play بعد التوقيع)" ;;
              esac
            fi
          done
          exit "$fail"

      - name: رفعُ المخرجات
        uses: actions/upload-artifact@v4
        with:
          # ⚠️ الاسمُ يقول **ما يُثبَّت**، لا حالةَ نسخةِ الإصدار وحدَها.
          # كان «unsigned» فقُرئ على أن الحزمةَ كلَّها لا تُثبَّت — وفيها
          # نسخةُ تشخيصٍ موقَّعةٌ تُثبَّت. واسمٌ يضلّل أسوأُ من اسمٍ ناقص.
          name: zadim-android-${{ steps.keystore.outputs.signed == 'yes' && 'release-signed' || 'debug-installable' }}
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
