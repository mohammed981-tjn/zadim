# بوّاباتُ المراحل — تُشغَّل في **كل دفعة**، لا مرّةً واحدة.
#
# ── لماذا في CI لا على جهازِ من كتب الكود ─────────────────────────
#
# بوّابةُ المرحلة ٣ نصُّها: «١٠٠ طلبٍ متزامن على مخزون ١٠ ⇒ عشرةٌ تنجح
# بالضبط». وهذا فحصٌ **لا يُختبر مرّةً ويُنسى**: أيُّ تغييرٍ في مُطلِقٍ
# أو هجرةٍ أو مسارِ حجزٍ يمكن أن يفتح البابَ ثانيةً، والعطلُ لا يظهر
# إلا يوم يبيع المتجرُ لأربعةٍ وتسعين عميلاً بضاعةً لعشرة.
#
# ── ولماذا قاعدةٌ حقيقيةٌ لا محاكاة ───────────────────────────────
#
# لأن **الحرّاس في القاعدة لا في الكود**: قيودُ `CHECK`، ومُطلِقاتٌ
# تقفل صفوفاً بـ`FOR UPDATE`، وقواعدُ `DO INSTEAD NOTHING`. ومحاكاةٌ
# لا تنفّذ SQL تُمرّر كلَّ ذلك وهو معطَّل — فيمرّ الاختبارُ **لسببٍ غير
# الذي نظنّه**، وتلك أسوأُ من ألّا نختبر.
#
# وكلفتُها صفر: المستودعُ عامّ، ودقائقُ Actions في العامّ مجانيةٌ بلا حدّ.
name: بوّابات التحقّق

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zadim
          POSTGRES_PASSWORD: zadim
          POSTGRES_DB: zadim_test
        ports: ['5432:5432']
        # بلا هذا الفحص تبدأ الخطوةُ التالية قبل أن تقبل القاعدةُ
        # اتصالاً، فتسقط الهجرةُ بعطلٍ يبدو عطلَ كودٍ وهو عطلُ توقيت.
        #
        # ⚠️ و`-d` ليست زينة: `pg_isready` بلا اسم قاعدةٍ يسأل عن قاعدةٍ
        # باسم المستخدم — و`zadim` غيرُ موجودة. فيظلّ الفحصُ أحمرَ خمسَ
        # عشرة مرّةً («database "zadim" does not exist») ثم تمضي الورشةُ
        # على أيّ حال. فحصُ صحّةٍ يفشل دائماً ولا يمنع شيئاً أسوأُ من
        # غيابه: يُعلّم القارئ تجاهلَ الأحمر.
        options: >-
          --health-cmd "pg_isready -U zadim -d zadim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://zadim:zadim@localhost:5432/zadim_test
      DATABASE_SCHEMA: zadim
      # أسرارُ تطويرٍ صريحةٌ لقاعدةٍ تُخلق وتموت مع التشغيلة. والصراحةُ
      # هنا أنظفُ من سرٍّ في المستودع يوهم أن له قيمة.
      JWT_SECRET: ci-only-not-a-secret
      COOKIE_SECRET: ci-only-not-a-secret
      NODE_OPTIONS: --max-old-space-size=4096

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: تثبيت الحزم
        run: npm ci

      # 🔴 خطوةٌ لا يُستغنى عنها: **Medusa لا يُنشئ المخطَّط**، يفترض
      # وجودَه. وقاعدةٌ جديدةٌ ليس فيها إلا `public`، فتسقط أوّلُ هجرةٍ
      # بـ«no schema has been selected to create in» — رسالةٌ تبدو عطلَ
      # إعدادٍ في الكود وهي غيابُ سطرٍ واحد. (سقطت أوّلُ تشغيلةٍ عليها.)
      # 🔴 و`search_path` صراحةً — لا بالصدفة.
      #
      # `medusa db:migrate` يضع جداولَ وحداتنا (٢٢) في `databaseSchema`،
      # وهجراتُ Medusa الأساسية (١٦٧) تكتب SQL خاماً بأسماءٍ غيرِ مؤهَّلة
      # فتذهب حيث يقول `search_path` — وافتراضُه `"$user", public`.
      #
      # ومستخدمُ الورشة اسمُه `zadim` والمخطَّطُ `zadim`، فكان المسارُ
      # يصيب **صدفةً**: `"$user"` يطابق المخطَّط. وقاعدةُ الإنتاج دورُها
      # `postgres` (في Railway وسوبابيس معاً) — فتصيب الورشةُ ويتناثر
      # الإنتاج، وهو أسوأُ أنواع الخضرة.
      #
      # فتُضبط هنا كما تُضبط في الإنتاج، وتُفحص في `migrate-once.ts`.
      - name: إنشاء المخطَّط وضبطُ مسار البحث
        run: |
          psql "$DATABASE_URL" -c 'create schema if not exists zadim'
          psql "$DATABASE_URL" -c 'alter role zadim in database zadim_test set search_path = zadim, public'

      # 🔴 **بنفس الطريق الذي تسلكه الحاوية** لا بـ`db:migrate` مباشرةً.
      #
      # نقطةُ الدخول تنادي `migrate-once.js` (قفلٌ استشاريٌّ حول الهجرة،
      # أُضيف بعد أن تسابق إقلاعان على أوّل نشرةٍ حقيقية فأفسدا المخطَّط).
      # وورشةٌ تهاجر بأمرٍ **غيرِ** الذي يهاجر به الإنتاج تترك أخطرَ سطرٍ
      # في الإقلاع بلا فحص — وهو بالضبط ما نتعلّم منه هنا.
      - name: الهجرات (بنفس مُشغّل الإنتاج)
        run: npx ts-node src/scripts/migrate-once.ts

      - name: البذور
        run: |
          npx medusa exec ./src/scripts/seed-access.ts
          npx medusa exec ./src/scripts/seed-catalog.ts
          npx medusa exec ./src/scripts/seed-commerce.ts

      # 🔴 البوّابة. وتُشغَّل **أوّلاً** لا آخراً: إن انكسر منعُ البيع
      # الزائد فذاك أخطرُ ما يمكن أن ينكسر، ولا معنى لانتظار بقية
      # الفحوص لنعرف.
      - name: بوّابة المرحلة ٣ — التزاحم والمخزون
        run: npx medusa exec ./src/scripts/verify-inventory.ts

      # 🔴 والبوّابةُ الثانية خطراً: «يُرفض **قبل أخذ المال**». وتُقاس
      # بعدّ الطلبات قبل الرفض وبعده — رفضٌ يُعيد رسالةً ويُنشئ الطلبَ
      # خلفها أسوأُ من قبولٍ صريح، لأنه يبدو آمناً.
      - name: بوّابة المرحلة ٤ — السلّة و Checkout
        run: npx medusa exec ./src/scripts/verify-checkout.ts

      # وبوّابةُ المرحلة ٥ تُشغَّل قبل الباقي أيضاً: **المصفوفةُ كاملةً**
      # — كلُّ حالةٍ إلى كل حالة على القاعدة. وانكسارُها يعني أن الملغى
      # صار يُحيا، وذاك لا ينتظر بقيةَ الفحوص.
      - name: بوّابة المرحلة ٥ — آلةُ حالات الطلب
        run: npx medusa exec ./src/scripts/verify-orders.ts

      # وبوّابةُ المرحلة ٦: التحصيلُ بعد الشحن، وسلسلةُ الفواتير. وهذه
      # الأخيرةُ **لا تُصلَح بأثرٍ رجعيّ** — فانكسارُها اليوم يعني فجوةً
      # تُفسَّر للهيئة غداً.
      - name: بوّابة المرحلة ٦ — المدفوعات والفوترة
        run: npx medusa exec ./src/scripts/verify-payments.ts

      # وبوّابةُ المرحلة ٧: صفرُ أجرةٍ في الكود، وناقلٌ بلا تعديلِ ملفٍّ
      # خارج مجلَّده، وباركودٌ خاطئ يوقف اللقط.
      - name: بوّابة المرحلة ٧ — الشحن والتنفيذ
        run: npx medusa exec ./src/scripts/verify-fulfilment.ts

      # وبوّابةُ المرحلة ٨: كلُّ رقمٍ في اللوحة يُعاد حسابُه بـSQL خام
      # ويُقارن، ودفعةٌ على ٥٠٠ تُطبَّق وتُتراجَع.
      - name: بوّابة المرحلة ٨ — اللوحة والدفعات
        run: npx medusa exec ./src/scripts/verify-dashboard.ts

      # وبوّابةُ المرحلة ٩ (شطرُها الخلفيّ): ترتيبُ الرئيسية يتغيّر بنداءٍ
      # واحد بلا بناءٍ ولا نشر. والسرعةُ والاتجاهُ يُقاسان على واجهةٍ
      # تعمل، لا هنا — ومكتوبٌ في رأس السكربت.
      - name: بوّابة المرحلة ٩ — ترتيبُ الرئيسية
        run: npx medusa exec ./src/scripts/verify-storefront.ts

      # وبوّابةُ المرحلة ١٠: الراجعُ في الحجر، والرفُّ لا يُفتح إلا
      # بحكمٍ بشريّ. وتُقاس بأثرٍ لا بردّ: المتاحُ للبيع قبل وبعد.
      - name: بوّابة المرحلة ١٠ — المرتجعات
        run: npx medusa exec ./src/scripts/verify-returns.ts

      # وبوّابةُ المرحلة ١١: التسويقُ من الصندوق لا من ماسح. وأهمُّ
      # فحصيها: الحدثُ يقع ويُلغى مع معاملته، **وفاحصُ الماسح يُمسك
      # سطراً ماسحاً مصطنَعاً** — وإلا فصفرُه لا يعني شيئاً.
      - name: بوّابة المرحلة ١١ — التسويق
        run: npx medusa exec ./src/scripts/verify-marketing.ts

      # وبوّابةُ المرحلة ١١ب (شطرُها الخلفيّ): المحتوى يُترجَم **كبيانات**
      # لا كنصٍّ في الكود، وما لا يجوز ترجمتُه (`handle`/`status`)
      # ترفضه القاعدةُ لا المسار. وأمّا «`/en` إنجليزيةٌ فعلاً» فتُقاس
      # في وظيفة المتصفّح أدناه — وخضرةُ هذه لا تعنيها.
      - name: بوّابة المرحلة ١١ب — الترجمة كبيانات
        run: npx medusa exec ./src/scripts/verify-i18n.ts

      - name: بوّابة المرحلة ١ — الصلاحيات
        run: npx medusa exec ./src/scripts/verify-access.ts

      - name: الحارس — خريطةُ المسارات
        run: npx medusa exec ./src/scripts/verify-guard.ts

      - name: بوّابة المرحلة ٢ — الكتالوج
        run: npx medusa exec ./src/scripts/verify-catalog.ts

      - name: بوّابة المرحلة ١٥ — تحديدُ معدّل النداءات
        run: npx medusa exec ./src/scripts/verify-security.ts

      # 🔴 بوّابةُ الوصل — تُمسك صنفاً من العطب لم يكن يمسكه شيء.
      #
      # فحصٌ شاملٌ (2026-09-03) وجد ثلاثَ وحداتٍ مكتملةً مُختبَرةً لا
      # يناديها مسارُ إنتاجٍ واحد: الفوترةُ وسياسةُ COD وتصريفُ التسويق.
      # وبوّاباتُها كلُّها **خضراء** — لأنها تنادي الدالّةَ بيدها. فكان
      # المتجرُ يبيع بصفرِ فاتورة، وحدُّ الدفع عند الاستلام حبراً.
      # وهذه تسأل السؤالَ الذي لم يكن يُسأل: **هل يناديها أحدٌ غيرُك؟**
      - name: بوّابةُ الوصل — كلُّ قدرةٍ حرجةٍ يناديها كودُ إنتاج
        run: npx medusa exec ./src/scripts/verify-wiring.ts

      # 🔴 بوّابةُ «ما لا يُؤجَّل» — البندان اللذان أسقطهما الانتقالُ إلى
      # Medusa بلا قرارٍ مكتوب (قِيسا غائبَين في 2026-09-03).
      #
      # وأخطرُ ما تحرسه ليس وجودَ العمود بل **جمودَه**: عمودٌ اسمُه
      # `unit_cost` يُكتب مرّتين ليس تكلفةً مجمَّدة، بل حقلٌ باسمٍ يَعِد
      # بما لا يفي به — ثم يتغيّر ربحُ يناير في مارس.
      - name: بوّابةُ «ما لا يُؤجَّل» — التكلفةُ المجمَّدة و vendor_id
        run: npx medusa exec ./src/scripts/verify-finance.ts

      # فحصُ الأدلّة الستّة — بلا قاعدةٍ ولا متصفّح، فثمنُه ثوانٍ.
      #
      # وأهمُّ ما فيه أنه يقابل **الشاشاتِ المذكورةَ في دليل المدير
      # بالشاشات المبنيّة فعلاً**، في الاتجاهين. فمديرٌ يبحث عن زرٍّ
      # وصفه الدليلُ ولا وجودَ له يظنّ النظامَ معطوباً — والخطأُ في
      # الدليل، ولا سبيلَ له إلى معرفة ذلك.
      - name: الأدلّة الستّة
        working-directory: .
        run: node scripts/verify-guides.mjs

      # البناءُ آخراً: فحصٌ أخيرٌ أن ما مرّ يُترجَم ويُحزَم فعلاً.
      - name: البناء
        run: npx medusa build

      # ── الحارس: مساراتُ نقطة الدخول موجودةٌ في البناء ───────────────
      #
      # `docker-entrypoint.sh` ينادي `./src/scripts/<اسم>.js` — مساراتٍ
      # **مُترجَمة** لا مصدرية. وإعادةُ تسمية سكربتٍ أو نقلُه لا تكسر
      # شيئاً هنا: تكسر **الإقلاعَ في الإنتاج**، بعد أن يكون كلُّ شيءٍ
      # أخضرَ ودُفع. فالفجوةُ بين ما تُنادي الحاويةُ وما يُنتجه البناءُ
      # لا يسدّها إلا فحصٌ يقارن الاثنين.
      - name: الحارس — نقطةُ الدخول تنادي ما هو مبنيٌّ فعلاً
        working-directory: apps/backend
        run: |
          set -euo pipefail
          REFS=$(grep -oE '\./src/scripts/[a-z-]+\.js' docker-entrypoint.sh | sort -u)
          # شاهدٌ موجب: فاحصٌ لا يجد شيئاً ليفحصه يمرّ صامتاً — وهو أعمى.
          COUNT=$(printf '%s\n' "$REFS" | grep -c . || true)
          if [ "$COUNT" -lt 3 ]; then
            echo "✗ الشاهدُ الموجب سقط: وُجد $COUNT مسارٍ في نقطة الدخول، والمنتظَر ٣ فأكثر."
            echo "   إمّا حُذفت البذورُ من نقطة الدخول، وإمّا تغيّر شكلُ النداء فصار الفاحصُ أعمى."
            exit 1
          fi
          MISSING=0
          for ref in $REFS; do
            if [ -f ".medusa/server/${ref#./}" ]; then
              echo "✓ $ref"
            else
              echo "✗ $ref — تناديه نقطةُ الدخول ولا يُنتجه البناء"
              MISSING=1
            fi
          done
          # وشاهدٌ سالب: مسارٌ نعلم أنه غيرُ موجودٍ يجب أن يُرفض.
          if [ -f ".medusa/server/src/scripts/seed-nothing.js" ]; then
            echo "✗ الشاهدُ السالب سقط: مسارٌ وهميٌّ وُجد."
            exit 1
          fi
          [ "$MISSING" -eq 0 ] && echo "✅ كلُّ ما تناديه نقطةُ الدخول ($COUNT) موجودٌ في البناء."
          exit "$MISSING"

      # ⚠️ **والتدقيقُ آخرَ الخطوات عمداً.**
      #
      # كان قبل «الأدلّة» و«البناء» و«حارس نقطة الدخول». وحين سقط على
      # main (2026-09-02) **تُخطّيت الثلاثةُ خلفه** — فلم يُتحقَّق من أن
      # المشروع يُبنى أصلاً، ولا من أن نقطةَ الدخول تنادي ما هو مبنيّ،
      # وهما حارسا الإقلاع في الإنتاج.
      #
      # وهو **سقّاطةٌ لا بوّابةٌ مطلقة** بنصّ تعليقه أدناه: عددُ ثغرات
      # `npm audit` يتحرّك مع قاعدة التحذيرات لا مع المستودع، فيسقط بلا
      # أن يتغيّر سطرٌ واحد. وسقّاطةٌ كهذه لا يصحّ أن تحجب حارساً يمنع
      # كسرَ الإقلاع. فصارت آخرَ ما يُشغَّل: تُوقف الدمج، ولا تُعمي.
      # تدقيقُ الاعتماديات — سقّاطةٌ لا بوّابةٌ مطلقة.
      #
      # ٦٩ ثغرةً عاليةً اليوم **كلُّها داخل شجرة Medusa**، ولا نملك
      # إصلاحَها. وورشةٌ تفشل من أوّل يومٍ ولا تستطيع أن تنجح تُعلّم
      # قارئَها تجاهلَ الأحمر — فيمرّ الأحمرُ الحقيقيُّ بينها.
      # فالحكمُ على ما نملك: الحرجةُ بلا تسامح، والازديادُ يُوقف،
      # والمباشرةُ التي اخترناها نحن لا عذرَ فيها.
      - name: تدقيقُ الاعتماديات
        working-directory: .
        run: node scripts/audit-deps.mjs

  # ── بوّابةُ المتصفّح — وظيفةٌ ثانيةٌ لا خطوةٌ في الأولى ──────────────
  #
  # الوظيفةُ أعلاه بلا متصفّحٍ وتنتهي في دقائق، وتُشغَّل على كل دفعة.
  # وإقحامُ Chromium وNext وLighthouse فيها يُبطّئ **كلَّ** دفعةٍ خلفيّة
  # لأجل فحصٍ لا يمسّها. فالفصلُ يُبقي البوّاباتِ العشرَ سريعةً كما هي،
  # ويُبقي هذه كاملةً: خلفيّةٌ حقيقيةٌ وواجهةٌ مبنيّةٌ ومتصفّحٌ يرسم.
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zadim
          POSTGRES_PASSWORD: zadim
          POSTGRES_DB: zadim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zadim -d zadim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://zadim:zadim@localhost:5432/zadim_test
      DATABASE_SCHEMA: zadim
      JWT_SECRET: ci-only-not-a-secret
      COOKIE_SECRET: ci-only-not-a-secret
      NODE_OPTIONS: --max-old-space-size=4096
      # 🔴 لازمٌ لأن هذه الوظيفة تُقلع الخلفيّة بـ`medusa start` — وهو
      # **يعمل في وضع الإنتاج**. وحارسُ `MEDUSA_BACKEND_URL` يمنع
      # الإقلاعَ بلا عنوانٍ صريح (وإلا كُتبت روابطُ صورٍ بـlocalhost
      # في القاعدة)، فكان الخادمُ يموت ويسقط الفحصُ بـ«Timed out
      # waiting for /health» — رسالةٌ تشير إلى المهلة لا إلى سببها.
      #
      # والقيمةُ صحيحةٌ هنا فعلاً لا التفافاً: الخلفيّةُ والواجهةُ على
      # نفس الآلة في هذه الوظيفة.
      MEDUSA_BACKEND_URL: http://localhost:9000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── الخلفيّة: تُبنى وتُقلع، وبذورُها هي بذورُ البوّابات ──────────
      - name: حزمُ الخلفيّة
        working-directory: apps/backend
        run: npm ci

      # 🔴 و`search_path` صراحةً — لا بالصدفة.
      #
      # `medusa db:migrate` يضع جداولَ وحداتنا (٢٢) في `databaseSchema`،
      # وهجراتُ Medusa الأساسية (١٦٧) تكتب SQL خاماً بأسماءٍ غيرِ مؤهَّلة
      # فتذهب حيث يقول `search_path` — وافتراضُه `"$user", public`.
      #
      # ومستخدمُ الورشة اسمُه `zadim` والمخطَّطُ `zadim`، فكان المسارُ
      # يصيب **صدفةً**: `"$user"` يطابق المخطَّط. وقاعدةُ الإنتاج دورُها
      # `postgres` (في Railway وسوبابيس معاً) — فتصيب الورشةُ ويتناثر
      # الإنتاج، وهو أسوأُ أنواع الخضرة.
      #
      # فتُضبط هنا كما تُضبط في الإنتاج، وتُفحص في `migrate-once.ts`.
      - name: إنشاء المخطَّط وضبطُ مسار البحث
        run: |
          psql "$DATABASE_URL" -c 'create schema if not exists zadim'
          psql "$DATABASE_URL" -c 'alter role zadim in database zadim_test set search_path = zadim, public'

      - name: هجراتُ الخلفيّة وبذورُها
        working-directory: apps/backend
        run: |
          npx medusa db:migrate
          npx medusa exec ./src/scripts/seed-access.ts
          npx medusa exec ./src/scripts/seed-catalog.ts
          npx medusa exec ./src/scripts/seed-commerce.ts

      # 🔴 مفتاحُ النشر يُقرأ من القاعدة لا يُكتب هنا: مفتاحُ CI يُولَّد
      # في البذور في كل تشغيلة، فمفتاحٌ ثابتٌ في الملفّ يكون خطأً بعد
      # أوّل تشغيلة — والواجهةُ ترى «المتجرُ لم يُضبط» ويُظنّ عطلَ واجهة.
      - name: قراءةُ مفتاح النشر
        run: |
          PK=$(psql "$DATABASE_URL" -tA -c \
            "select token from zadim.api_key where type='publishable' and revoked_at is null limit 1")
          test -n "$PK" || { echo "::error::لا مفتاحَ نشرٍ في القاعدة"; exit 1; }
          echo "MEDUSA_PK=$PK" >> "$GITHUB_ENV"

      - name: إقلاعُ الخلفيّة
        working-directory: apps/backend
        run: |
          npx medusa build
          (cd .medusa/server && npm ci --omit=dev && npx medusa start &)
          npx wait-on -t 180000 http://localhost:9000/health

      # ── 🔴 الفحصُ الوحيد الذي يُثبت أن حارسَ المعدّل **مركَّب** ──────
      #
      # `verify-security.ts` يقيس منطقَ الحارس وقيودَه وذرّيةَ عدّاده —
      # ولا يُثبت أن الوسيطَ يُنادى أصلاً. والدرسُ مدفوعُ الثمن في
      # المرحلة ١١ب: `matcher: "/store/products"` **لا يُطابق شيئاً**،
      # لا نداءَ ولا خطأ — فيبقى كلُّ اختبارٍ وحدويٍّ أخضرَ والبابُ مفتوح.
      #
      # فلا يُثبتها إلا نداءٌ حقيقيٌّ على خادمٍ حيّ: عشرٌ تمرّ (401 —
      # وصلت المصادقةَ فعلاً)، والحاديةَ عشرةَ **429**.
      - name: حارسُ المعدّل — نداءٌ حقيقيٌّ على خادمٍ حيّ
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              http://localhost:9000/auth/user/emailpass \
              -H "Content-Type: application/json" -d '{"email":"a@b.c","password":"x"}')
            if [ "$CODE" = "429" ]; then
              echo "::error::النداء $i رُفض بـ429 — الحدُّ أضيقُ من ١٠"; exit 1
            fi
          done
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:9000/auth/user/emailpass \
            -H "Content-Type: application/json" -d '{"email":"a@b.c","password":"x"}')
          if [ "$CODE" != "429" ]; then
            echo "::error::النداء ١١ أعطى $CODE لا 429 — الوسيطُ غيرُ مركَّبٍ أو المُطابِقُ صامت"; exit 1
          fi
          echo "✅ عشرٌ مرّت والحاديةَ عشرةَ 429 — الحارسُ مركَّبٌ ويعمل"

      # ⚠️ ثم تُطفأ سياستا `/store` لبقية الوظيفة — عمداً وبسبب مقيس:
      # بوّابةُ الواجهة تفتح ثماني صفحاتٍ وتُشغّل Lighthouse ثلاثَ مرّاتٍ
      # لكلٍّ منها، وكلُّها من عنوانٍ واحد (localhost). فحدُّ ٣٠٠ قراءةٍ
      # في الدقيقة — وهو كريمٌ لزائرٍ حقيقيّ — يُتجاوَز هنا فتصير
      # البوّابةُ متذبذبةً لسببٍ ليس عطباً في الواجهة.
      #
      # وسياسةُ `/auth` **تبقى مشتعلة**: هي التي أُثبتت أعلاه.
      - name: إطفاءُ حدَّي المتجر لبقية الوظيفة
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "update zadim.zadim_rate_limit_policy set enabled = false
              where name in ('store_reads','store_writes')"

      # ── الواجهة: تُبنى وتُقلع ────────────────────────────────────
      - name: بناءُ الواجهة وإقلاعُها
        working-directory: apps/storefront
        env:
          NEXT_PUBLIC_MEDUSA_URL: http://localhost:9000
        run: |
          npm ci
          NEXT_PUBLIC_MEDUSA_PK="$MEDUSA_PK" npm run build
          (NEXT_PUBLIC_MEDUSA_PK="$MEDUSA_PK" npm start &)
          npx wait-on -t 120000 http://localhost:3000

      # ── المتصفّح: Chromium حقيقيٌّ يرسم الصفحة ──────────────────
      - name: أدواتُ القياس
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 🔴 البوّابة: الاتجاهُ والسرعةُ ومطابقةُ ترتيب الكتل.
      #
      # و`CHROMIUM_PATH` غيرُ مضبوطٍ هنا عمداً: `playwright install` يضع
      # المتصفّحَ في مكانه المعتاد ويعرفه Playwright بنفسه. (وأوّلُ تشغيلةٍ
      # سقطت هنا: كان السكربتُ يفرض مسارَ حاويةِ التطوير افتراضياً
      # فيبطل ذلك — «executable doesn't exist». صار المسارُ المبرمَجُ
      # يُستعمل **إن كان موجوداً فعلاً** لا لمجرّد أنه مكتوب.)
      #
      # ومنذ المرحلة ١١ب تُفحص **كلُّ صفحةٍ بلغتيها**: `/ar` و`/en` —
      # اتجاهاً ولغةً ونصّاً مرسوماً ودرجةَ Lighthouse. ودرجةُ الأداء
      # وسيطُ ثلاث تشغيلاتٍ لا واحدة (انظر تعليقَها في السكربت).
      - name: بوّابةُ المرحلتين ٩ و١٢ — الواجهة في متصفّح، باللغتين
        env:
          MEDUSA_URL: http://localhost:9000
        run: node scripts/verify-ui.mjs http://localhost:3000 --lighthouse
