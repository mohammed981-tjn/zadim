# الفحصُ الأمنيُّ الخارجيّ — بوّابة المرحلة ١٥، البند الأوّل.
#
# ── لماذا CodeQL وليس سكربتاً لنا ────────────────────────────────
#
# لأن البند يقول **«خارجيّ»**، وفاحصٌ نكتبه بأنفسنا يفحص ما خطر لنا.
# وأخطرُ ثغرةٍ هي التي لم تخطر — فلا يكشفها إلا محرّكٌ لا يعرف نيّتنا،
# بقواعدَ يكتبها من يبحث عن الثغرات مهنةً.
#
# وهو مجّانيٌّ على المستودعات العامّة، ونتيجتُه تصل تبويبَ Security
# في جيت هوب لا سجلَّ تشغيلةٍ يُنسى.
#
# ── وما لا يفعله ────────────────────────────────────────────────
#
# ⚠️ **ليس اختبارَ اختراق.** يقرأ الكودَ ولا يشغّل المتجر: لا يجرّب
# تجاوزَ صلاحية، ولا يقيس حدَّ النداءات، ولا يفتح جلسة. فخضرتُه تعني
# «لا نمطَ ثغرةٍ معروفاً في المصدر» — لا «المتجرُ آمن». واختبارُ
# الاختراق الحقيقيُّ يبقى بنداً على المالك في `10-deployment.md`.
name: الفحص الأمني الخارجي (CodeQL)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # أسبوعياً: قواعدُ CodeQL تتحدّث، فكودٌ لم يتغيّر قد يصير معروفَ
    # الثغرة غداً. وفحصٌ عند الدفع وحده لا يرى ذلك أبداً.
    - cron: "0 3 * * 1"

# لا حاجة لأكثر من هذا — والأقلُّ صلاحيةً هو الأصل.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: تحليل ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v4

      - name: تهيئة CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` أوسعُ من الافتراضيّ: يضيف أنماطَ
          # الجودة التي تتحوّل ثغراتٍ (مقارنةٌ خاطئة، وعدٌ مهمَل،
          # تعبيرٌ منتظمٌ كارثيُّ التراجع).
          queries: security-and-quality

      # لا بناء: المشروع TypeScript، وCodeQL يحلّل المصدر مباشرةً.
      # ومحاولةُ البناء هنا تجرّ قاعدةَ بياناتٍ وأسراراً بلا فائدة.
      - name: التحليل
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
