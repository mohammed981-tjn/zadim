# نبضةُ القاعدة — **مراقبةُ حياةٍ، لا التفافٌ على خمول**.
#
# ── ما كانت وما صارت ─────────────────────────────────────────────
#
# كانت «نبضةَ Supabase»: مشروعٌ مجانيٌّ يتوقّف بعد أسبوعِ خمول، فكانت
# الورشةُ تطرق بابَه كل يومين ليبقى حيّاً. وADR-033 نقل القاعدةَ إلى
# Railway — فسقط ذلك البندُ كلُّه: لا خمولَ يُخشى، ولا مشروعَ جارٍ
# نُبقيه صاحياً.
#
# **والباقي هو الشطرُ الذي كان يستحقّ البقاء**: استعلامٌ حقيقيٌّ يسأل
# القاعدةَ «أحيّةٌ أنت؟». وكان مكتوباً في نصِّه أنه «يعمل مع أيّ Postgres
# — سوبابيس أو Railway أو غيرهما»، فلم يحتج تغييراً.
#
# ── ولماذا تبقى أصلاً ────────────────────────────────────────────
#
# لأن قاعدةً لا تُجيب تُكتشف بطريقين: إمّا هنا كل يومين، وإمّا يوم يفتح
# عميلٌ المتجر فلا يجد شيئاً. والأولى أرخص.
#
# وكلفتُها صفر: المستودعُ عامّ، ودقائقُ Actions في العامّ مجانيةٌ بلا حدّ.
#
# ── الإعداد ──────────────────────────────────────────────────────
# Settings ← Secrets and variables ← Actions:
#   KEEPALIVE_DATABASE_URL  ← وصلةُ قراءةٍ فقط (انظر التعليق أدناه)
#
name: نبضة القاعدة

on:
  schedule:
    # يومياً: صارت مراقبةَ حياةٍ لا نبضةَ خمول، فالتأخّرُ يومين لا يُبرَّر.
    - cron: '17 4 * * *' # 04:17 UTC — بعيداً عن زحام الدقيقة صفر
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ── ١) النبضةُ التي **تتحقّق** لا التي تطرق الباب فقط ──────────
      #
      # 🔴 والفرقُ ليس تجميلاً. النبضةُ عبر REST أدناه تعدّ ردَّ 401
      # نجاحاً — عمداً، لأن وصولَ الطلب وحدَه يصفّر عدّادَ الخمول. لكن
      # أثرَه الجانبيّ أن **الورشةَ تخضرّ والقاعدةُ متوقّفةٌ فعلاً**:
      # ردُّ 401 يأتي من بوّابة سوبابيس، وقد لا تكون خلفَها قاعدةٌ حيّة.
      #
      # واستعلامٌ حقيقيّ لا يلتبس: إن أجاب `select 1` فالقاعدةُ تعمل،
      # وإن لم يُجب فقد عرفنا الآن لا يوم يفتح عميلٌ المتجر.
      #
      # ويعمل مع **أيّ** Postgres — سوبابيس أو Railway أو غيرهما — فلا
      # يرتبط بمزوّدٍ بعينه.
      #
      # ⚠️ **وحسابٌ للقراءة فقط، لا صاحبُ القاعدة.** المستودعُ عامّ،
      # وأسرارُ GitHub لا تظهر في السجلّات ولا تصل طلباتِ الدمج من
      # النسخ المتفرّعة — لكن رابطَ قاعدةٍ بصلاحية المالك يعني، إن
      # تسرّب يوماً، **حذفَ كلِّ شيء**. ونبضةٌ تحتاج `select 1` لا
      # تحتاج أكثر من القراءة:
      #
      #   create role zadim_pulse login password '…';
      #   grant connect on database railway to zadim_pulse;
      - name: نبضةُ القاعدة (استعلامٌ حقيقيّ)
        env:
          DB: ${{ secrets.KEEPALIVE_DATABASE_URL }}
        run: |
          set -u
          if [ -z "${DB:-}" ]; then
            echo "::warning::KEEPALIVE_DATABASE_URL غير مضبوط — تُستعمل نبضةُ REST وحدَها (تطرق ولا تتحقّق)."
            echo "⏭️  لا استعلامَ مباشر."
            exit 0
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client >/dev/null
          # `-v ON_ERROR_STOP=1` كي يسقط الأمرُ فعلاً عند الخطأ بدل أن
          # يطبع رسالةً ويخرج بصفر — وهو الفرقُ بين فحصٍ وزينة.
          out=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc 'select 1' 2>&1) || {
            echo "::error::القاعدةُ لا تُجيب — قد تكون متوقّفة. $out"
            exit 1
          }
          echo "✅ القاعدةُ حيّةٌ وأجابت ($out) — $(date -u '+%Y-%m-%d %H:%M') UTC"
