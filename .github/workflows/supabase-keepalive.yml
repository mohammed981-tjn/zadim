# نبضة Supabase — تمنع توقّف مشروع AdCraft الذي نسكنه (ADR-009).
#
# ── لماذا هذه الورشة موجودةٌ رغم وجود نبضةٍ في zadgo2 ──────────────
#
# مستودع zadgo2 ينبض `zol-adcraft` كل يومين بالفعل، وZadim يسكن **نفس
# المشروع** — فهو مغطّى. لكن ذلك يجعل **حياةَ متجرنا معلّقةً بورشةٍ في
# مستودعٍ آخر خاصّ**: تُعطَّل أو يُجمَّد فرعُها فيموت Zadim ولا أحد
# يعرف لماذا. وهذه نبضةٌ مستقلّة تُزيل تلك التبعية.
#
# وكلفتُها **صفر**: مستودعُنا عامّ، ودقائقُ Actions في العامّ مجانيةٌ
# بلا حدّ — لا تُحسب على رصيد الخطة كما تُحسب في zadgo2 الخاصّ.
#
# ── لماذا كل يومين لا كل ستّة ──────────────────────────────────────
#
# الحدُّ سبعةُ أيام، وجدولةُ GitHub **بذلُ جهدٍ لا ضمان**: تتأخّر
# دقائق، وتُسقط تشغيلاتٍ كاملةً وقتَ الزحام. فبنبضةٍ كل ستّة أيام
# تكفي تشغيلةٌ واحدةٌ ساقطة لتجاوز السبعة. وكلُّ يومين يعطي هامشَ
# ثلاثِ تشغيلاتٍ ساقطة.
#
# ── ولماذا ليست النبضة داخل القاعدة (pg_cron) ─────────────────────
#
# الخمولُ يُقاس بالطلبات **الواردة من الخارج**. ونشاطٌ داخل القاعدة
# لا يصفّر العدّاد — فالنبضة يجب أن تأتي من خارجها.
#
# ── الإعداد (عند بلوغ مرحلة سوبابيس) ──────────────────────────────
# Settings ← Secrets and variables ← Actions:
#   ADCRAFT_SUPABASE_URL       ← لوحة Supabase ← Settings ← API ← Project URL
#   ADCRAFT_SUPABASE_ANON_KEY  ← اختياري (انظر أدناه)
#
# **العنوان وحده يكفي**: مفتاحٌ غائبٌ أو مرفوض لا يمنع النبضة — الطلب
# يصل المشروع ويصفّر عدّاد الخمول ولو رُدّ بـ401. والمفتاح يحسّن
# الإشارة فقط. ومفتاح anon مصمَّمٌ ليكون علنياً أصلاً (هو داخل
# التطبيقات)، فوضعُه سرّاً هنا نظافةُ ترتيبٍ لا حمايةُ خزنة.
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '17 4 */2 * *' # كل يومين 04:17 UTC — بعيداً عن زحام الدقيقة صفر
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: نبضة مشروع AdCraft
        env:
          URL: ${{ secrets.ADCRAFT_SUPABASE_URL }}
          KEY: ${{ secrets.ADCRAFT_SUPABASE_ANON_KEY }}
        run: |
          set -u

          # حالةٌ متوقَّعة لا عطل: لم نبلغ مرحلة سوبابيس بعد، فلا سرَّ
          # مضبوطاً. تنبيهٌ ظاهرٌ ولا إسقاط — ورشةٌ حمراءُ شهرين تُعلّم
          # تجاهلَ الأحمر، وهو أسوأ من غيابها.
          if [ -z "${URL:-}" ]; then
            echo "::warning::ADCRAFT_SUPABASE_URL غير مضبوط — لم تُربط قاعدةُ سوبابيس بعد (ADR-009)."
            echo "⏭️  لا نبضة: المشروع لم يُربط بعد. أضف السرّ عند بلوغ مرحلة سوبابيس."
            exit 0
          fi

          # مفتاحٌ وهميٌّ مقصود حين يغيب الحقيقي: الطلب المرفوض 401 يصل
          # المشروع ويصفّر العدّاد — وحرمانُ المشروع من النبضة لأن
          # المفتاح ناقصٌ يهزم غايةَ الورشة كلَّها.
          keyless=0
          if [ -z "${KEY:-}" ]; then
            KEY="zadim-pulse-without-key"; keyless=1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                 "$URL/rest/v1/" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          # لا `|| echo 000` هنا: `-w %{http_code}` يطبع 000 بنفسه عند
          # الفشل، وإضافةُ echo تُلحقها فتصير «000000» فتسقط في حالة
          # «ردٌّ غير متوقّع» بدل «تعذّر الوصول» — رسالةٌ تضلّل من يقرأها.

          case "$code" in
            200|404)
              echo "✅ نبضة ناجحة (HTTP $code) — $(date -u '+%Y-%m-%d %H:%M') UTC" ;;
            401|403)
              # الطلبُ **وصل المشروع وردّ** — وهذا وحده ما يصفّر عدّاد
              # الخمول، وهو غاية النبضة.
              if [ "$keyless" = "1" ]; then
                echo "✅ نبضة بلا مفتاح (HTTP $code مقصود — الطلب وصل وصفّر العدّاد)"
              else
                echo "⚠️  وصلت النبضة (HTTP $code) لكن المفتاح مرفوض"
                echo "::warning::راجع ADCRAFT_SUPABASE_ANON_KEY — انسخه كاملاً بلا مسافات"
              fi ;;
            000)
              echo "::error::تعذّر الوصول إلى المشروع (مهلة أو عنوان خاطئ). المشروع معرَّضٌ للتوقّف."
              exit 1 ;;
            *)
              echo "::error::ردٌّ غير متوقّع (HTTP $code). المشروع معرَّضٌ للتوقّف."
              exit 1 ;;
          esac
